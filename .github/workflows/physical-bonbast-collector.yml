name: physical-bonbast-collector
# Fallback ingest only. IranPay API now acquires Bonbast in-process
# (OTC JSON handshake, then Telegram). This public cron stays as a
# backup writer of the same BONBAST book. Sequential boards:
# JSON relay → Telegram → HTML relay → origin last.
# Fail the job when no observation is ingested (genuine outage).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: physical-bonbast-tick
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Ingest one Bonbast observation
        env:
          IRANPAY_API_BASE: ${{ secrets.IRANPAY_API_BASE }}
          PHYSICAL_COLLECTOR_SECRET: ${{ secrets.PHYSICAL_COLLECTOR_SECRET }}
          COLLECTOR_INTERVAL_MS: "2000"
          COLLECTOR_DURATION_MS: "45000"
        run: node scripts/bonbast-collector.mjs
