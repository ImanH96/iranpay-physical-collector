name: production-synthetic-monitor

# 24/7 rollover: the session job dispatches the next run of THIS workflow
# with GITHUB_TOKEN (workflow_dispatch). GitHub documents that
# workflow_dispatch / repository_dispatch created with GITHUB_TOKEN DO
# start a new run. workflow_run chaining is capped at 3 levels and is
# not used.
#
# Cron is not used. One human workflow_dispatch starts the loop; every
# successor is created by the previous session.
#
# Duplicate guard: one dispatch step, run_attempt==1, local sentinel.
# Concurrency queues the successor until this job exits.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: tick = one probe; session = keep-alive every 5 minutes
        type: choice
        options:
          - session
          - tick
        default: session
      duration_ms:
        description: Session length in ms (default 4h50m in production).
        type: string
        default: "360000"

concurrency:
  group: production-synthetic-public
  cancel-in-progress: false

jobs:
  tick:
    if: github.event.inputs.mode == 'tick'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Run one production synthetic check
        env:
          SYNTHETIC_API_BASE: https://iranpay-api.onrender.com
          SYNTHETIC_WEB_BASE: https://iran-pay.vercel.app
          SYNTHETIC_INGEST_SECRET: ${{ secrets.SYNTHETIC_INGEST_SECRET }}
          SYNTHETIC_REQUIRE_INGEST: "1"
          SYNTHETIC_REQUIRE_PRODUCTION: "1"
          SYNTHETIC_RUNNER_ID: github-actions-public
          SYNTHETIC_EXPECTED_GIT_SHA: ${{ vars.SYNTHETIC_EXPECTED_GIT_SHA }}
        run: node scripts/synthetic-production-check.mjs

  session:
    if: github.event.inputs.mode != 'tick'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Run 5-minute synthetic session
        id: session
        env:
          SYNTHETIC_API_BASE: https://iranpay-api.onrender.com
          SYNTHETIC_WEB_BASE: https://iran-pay.vercel.app
          SYNTHETIC_INGEST_SECRET: ${{ secrets.SYNTHETIC_INGEST_SECRET }}
          SYNTHETIC_REQUIRE_INGEST: "1"
          SYNTHETIC_REQUIRE_PRODUCTION: "1"
          SYNTHETIC_RUNNER_ID: github-actions-public
          SYNTHETIC_EXPECTED_GIT_SHA: ${{ vars.SYNTHETIC_EXPECTED_GIT_SHA }}
          SYNTHETIC_INTERVAL_MS: "300000"
          SYNTHETIC_DURATION_MS: ${{ github.event.inputs.duration_ms || '17400000' }}
        run: node scripts/synthetic-session.mjs
      - name: Dispatch exactly one successor session
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/synthetic-dispatch-successor.sh
