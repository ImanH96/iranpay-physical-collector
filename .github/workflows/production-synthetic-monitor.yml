name: production-synthetic-monitor

# 24/7 rollover is event-driven ping-pong, not cron and not a human click.
#
# GitHub cron on this account has multi-hour gaps.
# A workflow cannot listen to itself, and GITHUB_TOKEN cannot dispatch the
# next run. So two workflows take turns:
#   production-synthetic-monitor  --workflow_run-->  production-synthetic-rollover
#   production-synthetic-rollover --workflow_run-->  production-synthetic-monitor
#
# cancelled is not chained so an operator can stop the loop. Resume once
# with workflow_dispatch on this workflow.
#
# Shared concurrency group production-synthetic-public: one session at a
# time. The next run is created only after the previous run completes.

on:
  workflow_run:
    workflows: ["production-synthetic-rollover"]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: tick = one probe; session = keep-alive every 5 minutes
        type: choice
        options:
          - session
          - tick
        default: session
      duration_ms:
        description: Session length in ms. workflow_run always uses 4h50m.
        type: string
        default: "17400000"

concurrency:
  group: production-synthetic-public
  cancel-in-progress: false

jobs:
  tick:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'tick'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Run one production synthetic check
        env:
          SYNTHETIC_API_BASE: https://iranpay-api.onrender.com
          SYNTHETIC_WEB_BASE: https://iran-pay.vercel.app
          SYNTHETIC_INGEST_SECRET: ${{ secrets.SYNTHETIC_INGEST_SECRET }}
          SYNTHETIC_REQUIRE_INGEST: "1"
          SYNTHETIC_REQUIRE_PRODUCTION: "1"
          SYNTHETIC_RUNNER_ID: github-actions-public
          SYNTHETIC_EXPECTED_GIT_SHA: ${{ vars.SYNTHETIC_EXPECTED_GIT_SHA }}
        run: node scripts/synthetic-production-check.mjs

  session:
    if: |
      (github.event_name == 'workflow_run' && contains(fromJSON('["success","failure"]'), github.event.workflow_run.conclusion))
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'tick')
    uses: ./.github/workflows/synthetic-session-callable.yml
    with:
      duration_ms: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.duration_ms || '17400000' }}
      predecessor_run: ${{ github.event.workflow_run.id || '' }}
      predecessor_conclusion: ${{ github.event.workflow_run.conclusion || '' }}
      predecessor_started: ${{ github.event.workflow_run.run_started_at || github.event.workflow_run.created_at || '' }}
      predecessor_updated: ${{ github.event.workflow_run.updated_at || '' }}
    secrets:
      SYNTHETIC_INGEST_SECRET: ${{ secrets.SYNTHETIC_INGEST_SECRET }}
