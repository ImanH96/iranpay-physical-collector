name: synthetic-session-callable

on:
  workflow_call:
    inputs:
      duration_ms:
        required: false
        type: string
        default: "17400000"
      predecessor_run:
        required: false
        type: string
        default: ""
      predecessor_conclusion:
        required: false
        type: string
        default: ""
      predecessor_started:
        required: false
        type: string
        default: ""
      predecessor_updated:
        required: false
        type: string
        default: ""
    secrets:
      SYNTHETIC_INGEST_SECRET:
        required: true

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Announce rollover trigger
        run: |
          echo "this_run=${GITHUB_RUN_ID}"
          echo "predecessor_run=${PRED_RUN}"
          echo "predecessor_conclusion=${PRED_CONCLUSION}"
        env:
          PRED_RUN: ${{ inputs.predecessor_run }}
          PRED_CONCLUSION: ${{ inputs.predecessor_conclusion }}
      - name: Back off after a short failed predecessor
        if: inputs.predecessor_conclusion == 'failure' && inputs.predecessor_started != '' && inputs.predecessor_updated != ''
        env:
          PRED_CREATED: ${{ inputs.predecessor_started }}
          PRED_UPDATED: ${{ inputs.predecessor_updated }}
        run: |
          python3 - <<'PY'
          import datetime, os, time
          created = os.environ["PRED_CREATED"]
          updated = os.environ["PRED_UPDATED"]
          c = datetime.datetime.fromisoformat(created.replace("Z", "+00:00"))
          u = datetime.datetime.fromisoformat(updated.replace("Z", "+00:00"))
          sec = (u - c).total_seconds()
          print(f"predecessor_duration_s={sec:.1f}")
          if sec < 120:
              print("short_failed_predecessor_backoff_s=480")
              time.sleep(480)
          PY
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Run 5-minute synthetic session
        env:
          SYNTHETIC_API_BASE: https://iranpay-api.onrender.com
          SYNTHETIC_WEB_BASE: https://iran-pay.vercel.app
          SYNTHETIC_INGEST_SECRET: ${{ secrets.SYNTHETIC_INGEST_SECRET }}
          SYNTHETIC_REQUIRE_INGEST: "1"
          SYNTHETIC_REQUIRE_PRODUCTION: "1"
          SYNTHETIC_RUNNER_ID: github-actions-public
          SYNTHETIC_EXPECTED_GIT_SHA: ${{ vars.SYNTHETIC_EXPECTED_GIT_SHA }}
          SYNTHETIC_INTERVAL_MS: "300000"
          SYNTHETIC_DURATION_MS: ${{ inputs.duration_ms }}
        run: node scripts/synthetic-session.mjs
